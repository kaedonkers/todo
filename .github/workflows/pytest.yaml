name: pytest

on: [push, pull_request]

jobs:
  test-linux-latest:
    runs-on: linux-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.59.0
          cache: true

      - name: Run tests
        run: pixi run tests -v

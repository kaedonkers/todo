[project]
authors = [{name = "Kevin Donkers", email = "k.donkers@exeter.ac.uk"}]
dependencies = []
name = "todo"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "apple"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
todo = { path = ".", editable = true }

[tool.pixi.tasks]
